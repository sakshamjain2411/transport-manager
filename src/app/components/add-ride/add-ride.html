<div class="overlay">
    <form [formGroup]="rideForm" (ngSubmit)="onSubmit()">
        <div class="modal">
            <div class="modal-header">
                <h2>Add New Ride</h2>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="vehicleType">Vehicle Type</label>
                    <select id="vehicleType" formControlName="vehicleType" required>
                        <option value="Car">Car</option>
                        <option value="Bike">Bike</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="vehicleNo">Vehicle Number</label>
                    <input id="vehicleNo" formControlName="vehicleNo" type="text" required />
                </div>
                <div class="form-group">
                    <label for="vacantSeats">Vacant Seats</label>
                    <input id="vacantSeats" formControlName="vacantSeats" type="number" max="6" required />
                </div>
                <div class="form-group">
                    <label for="time">Time</label>
                    <input id="time" formControlName="time" type="time" required />
                </div>
                <div class="form-group">
                    <label for="pickup">Pickup Location</label>
                    <input id="pickup" formControlName="pickup" type="text" required />
                </div>
                <div class="form-group">
                    <label for="destination">Destination</label>
                    <input id="destination" formControlName="destination" type="text" required />
                </div>
            </div>
            <div class="modal-footer">
                <button type="submit" class="btn btn-primary">Add Ride</button>
                <button type="button" class="btn btn-secondary" (click)="onClose()">Cancel</button>
            </div>
        </div>
    </form>
</div>
